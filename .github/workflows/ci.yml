name: ci
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src api app scripts
      - run: pytest -q --disable-warnings
      - run: python scripts/smoke_test.py
      - run: python scripts/benchmark.py --rows 10000
      - run: python -m pip wheel . --no-deps --wheel-dir /tmp/wheels
      - run: python -m pip check
  dependency-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - run: uv lock
      - run: uv lock --check
      - name: Report lock status
        run: echo 'Dependency resolution succeeded in the connected CI environment.'
