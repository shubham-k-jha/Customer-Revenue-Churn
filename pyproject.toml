[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-revenue-churn-intelligence"
version = "4.2.0"
description = "Universal AI data intelligence, analytics, BI, time-series and ML platform"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scikit-learn>=1.6",
    "duckdb>=1.1",
    "pyarrow>=18.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "joblib>=1.4",
    "requests>=2.32",
    "streamlit>=1.40",
    "plotly>=5.24",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "psycopg2-binary>=2.9",
    "prometheus-client>=0.21",
    "psutil>=6",
    "xgboost>=2.1",
    "shap>=0.46",
    "statsmodels>=0.14",
    "mlflow>=2.18",
    "great-expectations>=1.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
]

[tool.setuptools.packages.find]
include = ["src*", "api*", "app*"]
